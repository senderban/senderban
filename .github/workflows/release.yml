name: Release build

# Builds the unsigned Windows installer from a version tag, writes SHA256SUMS and a build-provenance attestation, and keeps them as
# workflow artifacts. It does NOT create a GitHub Release: publishing is a separate, deliberate step (ADR 0010). Unsigned for v0.1
# (SignPath comes after the first release, docs 010-altyapi-barindirma.md), so Windows SmartScreen warns on first run.
#
# Two jobs on purpose (security review 2026-10-27, FLAG-1): `build` runs every third-party install script, test and build step and holds
# no signing authority; `attest` holds `id-token: write` and runs only the download and the attestation, so code from a dependency
# cannot get the signing identity. A compromised `build` step still decides which file `attest` signs (SLSA Build Level 2, accepted for
# v0.1). A manual run builds (to look at the result) but is never attested.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache here: a release build restores nothing a branch run could have written (zizmor cache-poisoning).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The tag and the app version agree
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "const v=require('./apps/desktop/package.json').version; if ('v'+v!==process.env.TAG) { console.error('tag '+process.env.TAG+' does not match app version '+v); process.exit(1) }"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Build the installer
        run: npm run dist -w apps/desktop
      - name: SHA256SUMS
        shell: bash
        working-directory: apps/desktop/release
        run: sha256sum Senderban-Setup-*.exe | tee SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: senderban-windows-installer
          path: |
            apps/desktop/release/Senderban-Setup-*.exe
            apps/desktop/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  attest:
    needs: build
    # Only a pushed version tag is attested; a manual run on any branch is not.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the attestation is signed with this run's OIDC identity
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: senderban-windows-installer
          path: installer
      - name: The download is the file that SHA256SUMS names
        shell: bash
        working-directory: installer
        run: sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: installer/Senderban-Setup-*.exe
